<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>metal-fx playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400&display=swap">
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --text: #d4d4d4;
        --heading-fg: #ffffff;
        --text-muted: #6b6b6b;
        --input-bg: #1e1e1e;
        --panel-border: #2a2a2a;
        --accent: #ffffff;
        --pill-bg: #1d1d1d;
        --pill-fg: #f8f8f8;
        --pill-border: rgba(44, 47, 54, 0.52);
        --pill-shadow: inset 0 0 50px 0 rgba(255, 255, 255, 0.02);
        --card-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --radius: 8px;
        --code-bg: #111;
      }

      html[data-theme="light"] {
        --bg: #fdfdfd;
        --surface: #f6f6f8;
        --text: #1a1a22;
        --heading-fg: #111111;
        --text-muted: #5c5c6e;
        --input-bg: #ffffff;
        --panel-border: #c8c8d4;
        --accent: #111111;
        --pill-bg: #ffffff;
        --pill-fg: #121212;
        --pill-border: transparent;
        --pill-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.06),
          0 2px 6px 0 rgba(0, 0, 0, 0.05);
        --card-shadow: 0 8px 28px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(0, 0, 0, 0.06);
        --code-bg: #f0f0f4;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      button, input, select, textarea {
        font: inherit;
        color: inherit;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: background 0.2s, color 0.2s;
      }

      /* --- Layout --- */
      .pg-page {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 32px 64px;
      }

      .pg-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .pg-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: var(--heading-fg);
      }

      /* --- Controls toolbar --- */
      .pg-toolbar {
        display: flex;
        gap: 24px;
        align-items: flex-end;
        padding: 16px 20px;
        background: var(--surface);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .pg-control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .pg-control-group label,
      .pg-control-group-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
      }

      .pg-toggle-row {
        display: flex;
        gap: 4px;
      }

      /* --- Tab-style toggle buttons --- */
      .tab-btn {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid transparent;
        border-radius: 7px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .tab-btn:hover { color: var(--text); }
      .tab-btn.active {
        background: var(--input-bg);
        color: var(--accent);
        border-color: var(--panel-border);
      }

      /* --- Strength input --- */
      .pg-strength-input {
        width: 72px;
        padding: 6px 10px;
        border-radius: 7px;
        border: 1px solid var(--panel-border);
        background: var(--input-bg);
        color: var(--text);
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
      }
      .pg-strength-input:focus { border-color: var(--accent); }

      /* --- Preview card --- */
      .pg-preview {
        border-radius: 16px;
        background: var(--surface);
        border: 1px solid var(--panel-border);
        box-shadow: var(--card-shadow);
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 48px 24px;
        position: relative;
      }

      .pg-pause-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--panel-border);
        background: var(--input-bg);
        color: var(--text-muted);
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, border-color 0.15s;
      }
      .pg-pause-btn:hover { color: var(--text); border-color: var(--text-muted); }

      /* --- Code snippet --- */
      .pg-code {
        margin-top: 16px;
        padding: 16px 20px;
        border-radius: 12px;
        background: var(--code-bg);
        border: 1px solid var(--panel-border);
        font-family: 'Roboto Mono', monospace;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-muted);
        position: relative;
        white-space: pre;
        overflow-x: auto;
      }

      .pg-copy-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid var(--panel-border);
        background: var(--input-bg);
        color: var(--text-muted);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, border-color 0.15s;
      }
      .pg-copy-btn:hover { color: var(--text); border-color: var(--text-muted); }

      /* --- Divider --- */
      .pg-divider {
        border: none;
        border-top: 1px solid var(--panel-border);
        margin: 40px 0 32px;
      }

      /* --- Section titles --- */
      .section-title {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
      }

      /* --- Example cards --- */
      .example-card {
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--panel-border);
        box-shadow: var(--card-shadow);
        padding: 48px 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* --- Demo pill buttons (wrapped by MetalFx) ---
         Matches .btn-shell + .btn-label from the demo exactly. */
      .demo-pill {
        width: 140px;
        height: 40px;
        border-radius: 20px;
        border: 1px solid var(--pill-border);
        background: var(--pill-bg);
        color: var(--pill-fg);
        box-shadow: var(--pill-shadow);
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        line-height: 17.938px;
        letter-spacing: 0;
        white-space: nowrap;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .demo-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--pill-border);
        background: var(--pill-bg);
        color: var(--pill-fg);
        box-shadow: var(--pill-shadow);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      /* --- Mock chat input (matches demo .mock-chat: 448px, r=20, 104px inner) --- */
      .mock-chat {
        width: 448px;
        max-width: 100%;
        border-radius: 20px;
        background: rgba(29, 29, 29, 0.7);
        box-shadow:
          inset 0 0 0 1px rgba(44, 47, 54, 0.52),
          inset 0 0 50px 0 rgba(255, 255, 255, 0.02);
        padding: 20px 16px 16px;
        display: flex;
        flex-direction: column;
        height: 104px;
      }
      html[data-theme="light"] .mock-chat {
        background: rgba(255, 255, 255, 0.85);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.06),
          0 2px 6px 0 rgba(0, 0, 0, 0.05);
      }

      .mock-chat-input {
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 14px;
        line-height: 16px;
        font-family: inherit;
        outline: none;
        width: 100%;
        margin: 0;
        padding: 0;
        margin-bottom: 16px;
        resize: none;
      }
      .mock-chat-input::placeholder { color: #4e4e4e; }
      html[data-theme="light"] .mock-chat-input::placeholder { color: #9a9a9a; }

      .mock-chat-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: auto;
      }

      .mock-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 36px;
        padding: 0 10px 0 14px;
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.02),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
        color: #caccd2;
        font-size: 12px;
        line-height: 14px;
        font-family: inherit;
        cursor: default;
      }
      .mock-chip svg {
        width: 16px;
        height: 16px;
        color: #8E8E8E;
        transform: rotate(90deg);
      }
      html[data-theme="light"] .mock-chip {
        background: rgba(0, 0, 0, 0.04);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.06),
          inset 0 1px 0 0 rgba(0, 0, 0, 0.04);
        color: #555;
      }

      .mock-plus-btn {
        width: 36px;
        height: 36px;
        min-width: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.04);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.02),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
        border: none;
        color: #caccd2;
        font-size: 16px;
        cursor: default;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      html[data-theme="light"] .mock-plus-btn {
        background: rgba(0, 0, 0, 0.04);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.06),
          inset 0 1px 0 0 rgba(0, 0, 0, 0.04);
        color: #555;
      }

      /* --- Search pill (matches .ui-search from demo: 235×40, r=20) --- */
      .mock-search {
        width: 235px;
        height: 40px;
        border-radius: 20px;
        border: 1px solid var(--pill-border);
        background: var(--pill-bg);
        box-shadow: var(--pill-shadow);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 2px 10px 12px;
        color: var(--pill-fg);
        font-size: 14px;
        font-weight: 500;
        line-height: 17.938px;
        font-family: inherit;
      }
      .mock-search svg { flex-shrink: 0; opacity: 0.4; }
      .mock-search span { opacity: 0.3; }

      /* Dots button (matches .ui-icon-btn from demo: 40×40, r=20) */
      .mock-dots {
        width: 40px;
        height: 40px;
        border-radius: 20px;
        border: 1px solid var(--pill-border);
        background: var(--pill-bg);
        box-shadow: var(--pill-shadow);
        color: var(--pill-fg);
        font-size: 18px;
        letter-spacing: 2px;
        cursor: default;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .ui-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      /* --- Range inputs --- */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 5px;
        background: var(--input-bg);
        border-radius: 3px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #555;
        cursor: pointer;
        transition: transform 0.15s;
      }
      input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #555;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/playground/main.tsx"></script>
  </body>
</html>
